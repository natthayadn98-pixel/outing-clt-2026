<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lazywasabi/thai-web-fonts@7/fonts/Anakotmai/Anakotmai.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { font-family: 'Anakotmai', sans-serif; }
    body { background-color: #0c0217; color: #f1f5f9; min-height: 100vh; padding: 2rem 1rem; }
    .vip-input { background-color: #0e0523; border: 1px solid rgba(139, 92, 246, 0.35); }
  </style>
  <link rel="stylesheet" href="admin-pages-theme.css" />
<script>
(function(){
  const key = 'clt_admin_color_theme_v1';
  function setPageTheme(value) {
    if (value !== 'light' && value !== 'dark') return;
    document.documentElement.setAttribute('data-admin-theme', value);
  }
  try { setPageTheme(localStorage.getItem(key) || 'dark'); } catch (_) {}
  window.addEventListener('message', function(event) {
    if (event.origin !== location.origin || event.source !== window.parent) return;
    if (event.data && event.data.type === 'clt-admin-theme') setPageTheme(event.data.theme);
  });
  window.addEventListener('storage', function(event) {
    if (event.key === key) setPageTheme(event.newValue);
  });
})();
</script>
</head>
<body class="flex justify-center">

  <section class="w-full max-w-4xl bg-[#14082e]/95 border border-[#3c1d77] rounded-3xl p-6 sm:p-10 shadow-2xl backdrop-blur-xl">
    <div class="text-center mb-6">
      <h2 class="text-2xl sm:text-3xl font-extrabold text-[#facc15] tracking-wide flex items-center justify-center gap-2">
        <span>📋</span> รายชื่อผู้ที่เช็คอินแล้ว
      </h2>
      <p class="text-xs sm:text-sm text-purple-300/80 mt-1 font-light">จัดการเวลาเช็คอินรายคน เลือกลบเฉพาะรอบ หรือแก้ไขเวลา</p>
    </div>

    <div class="bg-[#0e0423]/90 border border-purple-800/80 rounded-2xl p-5 shadow-xl">
      <div class="flex justify-between items-center mb-4 pb-3 border-b border-purple-900/60">
        <span class="text-sm font-bold text-amber-300">พบผู้เช็คอินแล้วทั้งหมด <span id="checkedInCountBadge" class="text-white text-lg">0</span> คน</span>
        <button onclick="resetAllCheckedInGuests()" class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs">🗑️ ล้างเวลาทุกคน</button>
      </div>
      <div id="checkedInListContainer" class="space-y-3 max-h-[520px] overflow-y-auto pr-1"></div>
    </div>
  </section>

  <!-- MODAL: แก้ไขเวลา -->
  <div id="editCheckinModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-[#170b36] border border-purple-600/70 rounded-3xl p-6 max-w-sm w-full">
      <h3 class="text-base font-bold text-amber-300 mb-3">✏️ แก้ไขเวลาเช็คอิน</h3>
      <p id="editModalEmpName" class="text-xs text-purple-200 font-semibold mb-4">-</p>
      <input type="hidden" id="editModalEmpCode" />
      <div class="space-y-3 mb-5 text-xs">
        <div>
          <label class="block text-amber-300 mb-1">รอบเช้า</label>
          <input type="text" id="editModalMorningTime" class="w-full px-3 py-2 vip-input rounded-xl text-white" />
        </div>
        <div>
          <label class="block text-indigo-300 mb-1">รอบเย็น</label>
          <input type="text" id="editModalEveningTime" class="w-full px-3 py-2 vip-input rounded-xl text-white" />
        </div>
      </div>
      <div class="flex gap-2 justify-end">
        <button onclick="closeEditCheckinModal()" class="px-3.5 py-2 rounded-xl bg-purple-900/50 text-purple-300 text-xs">ยกเลิก</button>
        <button onclick="saveEditedCheckinTimes()" class="px-4 py-2 rounded-xl bg-amber-400 text-slate-950 font-bold text-xs">บันทึก</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ycljxlywewigwxovdnyj.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InljbGp4bHl3ZXdpZ3d4b3ZkbnlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1MzI5NjQsImV4cCI6MjEwNzEwODk2NH0.2j7_E3TuxcLU3royoFRjiFJDmI7dwKLrvJVOLUdSXpI";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let guestsList = [];

    async function loadData() {
      const { data } = await supabaseClient.from('guests').select('*');
      guestsList = data || [];
      renderCheckedInList();
    }

    function renderCheckedInList() {
      const container = document.getElementById('checkedInListContainer');
      const badge = document.getElementById('checkedInCountBadge');
      const checkedGuests = guestsList.filter(g => g.morning_check_in || g.evening_check_in);
      badge.textContent = checkedGuests.length;

      if (checkedGuests.length === 0) {
        container.innerHTML = '<div class="text-center py-10 text-purple-400/60 text-xs sm:text-sm">ยังไม่มีใครเช็คอิน</div>';
        return;
      }

      container.innerHTML = checkedGuests.map(g => `
        <div class="flex flex-col lg:flex-row lg:items-center justify-between p-3.5 rounded-2xl bg-[#09021a] border border-purple-900/50 gap-3">
          <div>
            <p class="text-xs sm:text-sm font-bold text-amber-200">${g.full_name} (${g.employee_code}) - ${g.branch || 'ทั่วไป'}</p>
            <p class="text-[11px] text-gray-400 mt-1">เช้า: ${g.morning_check_in || '-'} | เย็น: ${g.evening_check_in || '-'}</p>
          </div>
          <div class="flex gap-1.5">
            <button onclick="openEditCheckinModal('${g.employee_code}', '${g.full_name}', '${g.morning_check_in || ''}', '${g.evening_check_in || ''}')" class="px-2.5 py-1.5 rounded-xl bg-purple-900/60 text-purple-200 text-xs">✏️ แก้ไข</button>
            <button onclick="removeCheckInSingle('${g.employee_code}')" class="px-2.5 py-1.5 rounded-xl bg-rose-950/70 text-rose-300 text-xs">🗑️ ล้าง</button>
          </div>
        </div>
      `).join('');
    }

    function openEditCheckinModal(code, name, m, e) {
      document.getElementById('editModalEmpCode').value = code;
      document.getElementById('editModalEmpName').textContent = `${name} (${code})`;
      document.getElementById('editModalMorningTime').value = m;
      document.getElementById('editModalEveningTime').value = e;
      document.getElementById('editCheckinModal').classList.remove('hidden');
    }
    function closeEditCheckinModal() { document.getElementById('editCheckinModal').classList.add('hidden'); }

    async function saveEditedCheckinTimes() {
      const code = document.getElementById('editModalEmpCode').value;
      const m = document.getElementById('editModalMorningTime').value.trim() || null;
      const e = document.getElementById('editModalEveningTime').value.trim() || null;
      await supabaseClient.from('guests').update({ morning_check_in: m, evening_check_in: e }).eq('employee_code', code);
      closeEditCheckinModal();
      loadData();
    }

    async function removeCheckInSingle(code) {
      if (!confirm('ยืนยันล้างเวลาเช็คอินคนนี้?')) return;
      await supabaseClient.from('guests').update({ morning_check_in: null, evening_check_in: null }).eq('employee_code', code);
      loadData();
    }

    async function resetAllCheckedInGuests() {
      if (!confirm('ยืนยันล้างเวลาเช็คอินของทุกคน?')) return;
      await supabaseClient.from('guests').update({ morning_check_in: null, evening_check_in: null }).neq('employee_code', '');
      loadData();
    }

    loadData();
  </script>
</body>
</html>
