<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>พรีวิว CLT QR — โลโก้เหนือ QR</title><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>
*{box-sizing:border-box}body{font-family:system-ui,'Tahoma',sans-serif;margin:0;background:#1b0a2a;color:white;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:100%;max-width:390px;background:#251036;border:2px solid #d6a853;border-radius:24px;padding:20px;text-align:center}.brand img{width:80px;height:70px;object-fit:contain}.brand h1{font-size:17px;color:#f9d987;margin:5px 0 14px}.qr-wrap{background:#fff;border-radius:16px;width:fit-content;max-width:100%;padding:18px;margin:10px auto}.qr-wrap img,.qr-wrap canvas{display:block;max-width:100%;height:auto!important;image-rendering:pixelated}.pill{font-size:13px;color:#c4f2d2}.small{font-size:12px;color:#d7cee3}button{width:100%;padding:13px;border:0;border-radius:12px;background:#f4c74f;font-weight:700;color:#231226;cursor:pointer;margin-top:12px}.foot{font-size:12px;color:#ddd;margin-top:10px}.expanded{background:white;color:#171717}.expanded .card{background:white;border:0;max-width:100%;padding:10px}.expanded .brand h1{color:#881337}.expanded .pill,.expanded .small,.expanded .foot{color:#334155}.expanded button{background:#e2e8f0} .expanded .qr-wrap{padding:18px}
</style><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="clt-fonts.css">
</head><body><div class="card"><div class="brand"><img src="clt-logo.png" alt="CLT"><h1>งานเลี้ยงสังสรรค์ ประจำปี 2569</h1></div><div class="pill">QR สำหรับเช็คอิน — ตัวอย่างหน้าจอ</div><div class="qr-wrap"><div id="previewQr"></div></div><div class="small">QR สีดำบนพื้นขาว • ไม่มีโลโก้บังรหัส</div><button onclick="toggleSize()" id="expandButton">⛶ ขยาย QR เต็มหน้าจอ</button><div class="foot">QR นี้เป็นข้อมูลตัวอย่าง ไม่สามารถใช้เช็คอินได้จริง</div></div><script>
function draw(){let e=document.getElementById('previewQr');e.innerHTML='';let size=document.body.classList.contains('expanded')?Math.min(340,innerWidth-72,innerHeight-260):Math.min(270,innerWidth-110);new QRCode(e,{text:'CLT-PREVIEW-ONLY-NOT-VALID',width:size,height:size,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});}function toggleSize(){document.body.classList.toggle('expanded');document.getElementById('expandButton').textContent=document.body.classList.contains('expanded')?'↙ กลับขนาดปกติ':'⛶ ขยาย QR เต็มหน้าจอ';draw()}window.addEventListener('resize',draw);window.addEventListener('load',()=>{if(window.QRCode)draw();else document.getElementById('previewQr').textContent='ต้องเชื่อมต่ออินเทอร์เน็ตเพื่อแสดง QR ตัวอย่าง';});
</script></body></html>
