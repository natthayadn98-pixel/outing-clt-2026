<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lazywasabi/thai-web-fonts@7/fonts/Anakotmai/Anakotmai.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    * { font-family: 'Anakotmai', sans-serif; }
    body { background-color: #0c0217; color: #f1f5f9; min-height: 100vh; padding: 2rem 1rem; }
    .vip-input { background-color: #0e0523; border: 1px solid rgba(139, 92, 246, 0.35); transition: all 0.2s; }
    .vip-input:focus { border-color: #facc15; outline: none; }
  </style>
</head>
<body class="flex items-center justify-center">

  <section class="w-full max-w-2xl bg-[#14082e]/95 border border-[#3c1d77] rounded-3xl p-6 sm:p-10 shadow-2xl backdrop-blur-xl">
    <div class="text-center mb-7">
      <h2 class="text-xl sm:text-2xl font-bold text-amber-300">เพิ่มผู้เข้าร่วมใหม่ (Walk-in)</h2>
      <p class="text-xs sm:text-sm text-purple-300/70 mt-1 font-light">กรอกข้อมูล แล้วเลือกสร้าง QR Code หรือ สั่งเช็คอินเข้างานทันที</p>
    </div>

    <form id="walkinForm" onsubmit="event.preventDefault();" class="space-y-4">
      <div>
        <label class="block text-xs text-purple-300/90 mb-1.5">รหัสพนักงาน</label>
        <input type="text" id="walkinEmpCode" placeholder="รหัสพนักงาน (เช่น 012345)" class="w-full px-4 py-3 vip-input rounded-xl text-white text-sm" />
      </div>

      <div>
        <label class="block text-xs text-purple-300/90 mb-1.5">ชื่อ-นามสกุล <span class="text-rose-400 font-bold">*</span></label>
        <input type="text" id="walkinEmpName" required placeholder="ชื่อ-นามสกุล (บังคับ)" class="w-full px-4 py-3 vip-input rounded-xl text-white text-sm" />
      </div>

      <div>
        <label class="block text-xs text-purple-300/90 mb-1.5">สาขา / แผนก</label>
        <input type="text" id="walkinEmpBranch" placeholder="สาขา / แผนก" class="w-full px-4 py-3 vip-input rounded-xl text-white text-sm" />
      </div>

      <div id="walkinAlert" class="hidden text-xs rounded-xl p-3 border"></div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 pt-3">
        <button type="button" onclick="handleCreateWalkinQR()" class="w-full py-3.5 px-3 rounded-xl bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-300 text-slate-950 font-bold text-xs sm:text-sm transition flex items-center justify-center gap-1.5">
          <span>✨</span><span>สร้าง QR Code</span>
        </button>

        <button type="button" onclick="handleInstantCheckin()" class="w-full py-3.5 px-3 rounded-xl bg-gradient-to-r from-emerald-500 to-green-500 hover:from-emerald-400 text-slate-950 font-bold text-xs sm:text-sm transition flex items-center justify-center gap-1.5">
          <span>🏷️</span><span>เช็คอินเข้างานทันที</span>
        </button>

        <button type="button" onclick="resetWalkinForm()" class="w-full py-3.5 px-3 rounded-xl bg-[#2b3548] hover:bg-[#38455e] text-slate-200 font-medium text-xs sm:text-sm border border-slate-600/50 transition flex items-center justify-center gap-1.5">
          <span>🔄</span><span>ล้างข้อมูล</span>
        </button>
      </div>
    </form>
  </section>

  <!-- MODAL QR PREVIEW -->
  <div id="qrPreviewModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-[#170b36] border border-purple-600/70 rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl relative">
      <button onclick="closeQRModal()" class="absolute top-4 right-4 text-purple-400 hover:text-white text-lg">✕</button>
      <span class="inline-block px-3 py-1 rounded-full bg-amber-400/20 text-amber-300 border border-amber-400/30 text-[11px] font-semibold mb-3">VIP PARTY CONNECT PASS</span>
      <h3 id="modalGuestName" class="text-xl font-bold text-white mb-0.5">-</h3>
      <p id="modalGuestCode" class="text-xs text-purple-300 font-mono">-</p>
      <p id="modalGuestBranch" class="text-xs text-amber-300/90 mb-4">-</p>
      <div class="bg-white p-3.5 rounded-2xl mx-auto w-fit shadow-lg mb-4">
        <div id="modalQrCanvas" class="flex justify-center items-center"></div>
      </div>
      <p id="modalGuestToken" class="text-[10px] font-mono text-purple-400 mb-5 truncate">QR Code Data: -</p>
      <div class="flex gap-2">
        <button onclick="downloadModalQRCode()" class="flex-1 py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold text-xs transition">💾 บันทึกรูป QR</button>
        <button onclick="closeQRModal()" class="px-4 py-2.5 rounded-xl bg-purple-900/60 hover:bg-purple-800 text-purple-200 text-xs transition">ปิด</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ycljxlywewigwxovdnyj.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InljbGp4bHl3ZXdpZ3d4b3ZkbnlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1MzI5NjQsImV4cCI6MjEwNzEwODk2NH0.2j7_E3TuxcLU3royoFRjiFJDmI7dwKLrvJVOLUdSXpI";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function getCleanThaiTimeString() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      return `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    }

    function getCurrentCheckinSession() {
      const now = new Date();
      const current = now.getHours() * 60 + now.getMinutes();
      if (current >= 7*60 && current <= 9*60+30) return { valid: true, session: 'morning', name: 'รอบเช้า' };
      if (current >= 14*60) return { valid: true, session: 'evening', name: 'รอบเย็น' };
      return { valid: false, message: 'ขณะนี้อยู่นอกช่วงเวลาเช็คอิน (รอบเช้า: 07:00-09:30 น. / รอบเย็น: 14:00 น. เป็นต้นไป)' };
    }

    async function checkDuplicateEmployeeCode(empCode) {
      if (!empCode) return null;
      try {
        const { data } = await supabaseClient.from('guests').select('employee_code, full_name').eq('employee_code', empCode).maybeSingle();
        return data;
      } catch (e) { return null; }
    }

    function showWalkinAlert(text, type) {
      const alertBox = document.getElementById('walkinAlert');
      alertBox.classList.remove('hidden', 'bg-emerald-950/80', 'text-emerald-300', 'border-emerald-700', 'bg-rose-950/80', 'text-rose-300', 'border-rose-700', 'bg-amber-950/80', 'text-amber-300', 'border-amber-700');
      if (type === 'success') alertBox.className = 'text-xs rounded-xl p-3 border bg-emerald-950/80 text-emerald-300 border-emerald-700 block';
      else if (type === 'error') alertBox.className = 'text-xs rounded-xl p-3 border bg-rose-950/80 text-rose-300 border-rose-700 block';
      else alertBox.className = 'text-xs rounded-xl p-3 border bg-amber-950/80 text-amber-300 border-amber-700 block';
      alertBox.textContent = text;
    }

    async function handleCreateWalkinQR() {
      const codeInput = document.getElementById('walkinEmpCode').value.trim();
      const name = document.getElementById('walkinEmpName').value.trim();
      const branch = document.getElementById('walkinEmpBranch').value.trim();
      if (!name) return showWalkinAlert('กรุณากรอกชื่อ-นามสกุล (บังคับ)', 'error');

      if (codeInput) {
        showWalkinAlert('กำลังตรวจสอบรหัสพนักงาน...', 'info');
        const dup = await checkDuplicateEmployeeCode(codeInput);
        if (dup) return showWalkinAlert(`❌ มีข้อมูลรหัสพนักงาน "${codeInput}" ในระบบแล้ว (${dup.full_name})`, 'error');
      }

      const empCode = codeInput || `W${Date.now().toString().slice(-5)}`;
      const guestObj = { employee_code: empCode, full_name: name, branch: branch || 'ทั่วไป', qr_token: empCode };

      showWalkinAlert('กำลังบันทึกลงฐานข้อมูล...', 'info');
      try {
        const { error } = await supabaseClient.from('guests').insert([guestObj]);
        if (error) throw error;
        showWalkinAlert(`✨ สร้าง QR Code สำหรับ "${name}" สำเร็จ!`, 'success');
        openQRModal(name, empCode, guestObj.branch, empCode);
        resetWalkinForm();
      } catch (err) {
        showWalkinAlert('เกิดข้อผิดพลาด: ' + err.message, 'error');
      }
    }

    async function handleInstantCheckin() {
      const codeInput = document.getElementById('walkinEmpCode').value.trim();
      const name = document.getElementById('walkinEmpName').value.trim();
      const branch = document.getElementById('walkinEmpBranch').value.trim();
      if (!name) return showWalkinAlert('กรุณากรอกชื่อ-นามสกุล (บังคับ)', 'error');

      const sess = getCurrentCheckinSession();
      if (!sess.valid) return showWalkinAlert(`⚠️ ไม่สามารถเช็คอินได้: ${sess.message}`, 'error');

      const empCode = codeInput || `W${Date.now().toString().slice(-5)}`;
      const cleanTime = getCleanThaiTimeString();
      const guestObj = {
        employee_code: empCode,
        full_name: name,
        branch: branch || 'ทั่วไป',
        qr_token: empCode,
        morning_check_in: sess.session === 'morning' ? cleanTime : null,
        evening_check_in: sess.session === 'evening' ? cleanTime : null
      };

      try {
        const { error } = await supabaseClient.from('guests').insert([guestObj]);
        if (error) throw error;
        showWalkinAlert(`🎉 เช็คอินเข้างานทันทีสำเร็จ (${sess.name} เวลา ${cleanTime} น.)`, 'success');
        resetWalkinForm();
      } catch (err) {
        showWalkinAlert('เกิดข้อผิดพลาด: ' + err.message, 'error');
      }
    }

    function resetWalkinForm() {
      document.getElementById('walkinEmpCode').value = '';
      document.getElementById('walkinEmpName').value = '';
      document.getElementById('walkinEmpBranch').value = '';
      document.getElementById('walkinAlert').classList.add('hidden');
    }

    function openQRModal(name, code, branch, token) {
      document.getElementById('modalGuestName').textContent = name;
      document.getElementById('modalGuestCode').textContent = `รหัส: ${code}`;
      document.getElementById('modalGuestBranch').textContent = `สาขา: ${branch}`;
      document.getElementById('modalGuestToken').textContent = `QR Code: ${token}`;
      const qrCanvas = document.getElementById('modalQrCanvas');
      qrCanvas.innerHTML = '';
      new QRCode(qrCanvas, { text: String(token), width: 160, height: 160 });
      document.getElementById('qrPreviewModal').classList.remove('hidden');
    }

    function closeQRModal() { document.getElementById('qrPreviewModal').classList.add('hidden'); }

    function downloadModalQRCode() {
      const canvas = document.querySelector('#modalQrCanvas canvas');
      if (canvas) {
        const link = document.createElement('a');
        link.download = `QR-${document.getElementById('modalGuestCode').textContent}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }
    }
  </script>
</body>
</html>
